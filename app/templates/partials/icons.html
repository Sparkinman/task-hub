{# Inline SVG icons.

   Inlined rather than loaded from an icon font or a sprite sheet so the
   interface has no external dependency and renders correctly the instant the
   HTML arrives. All are 24x24 stroke icons that inherit currentColor. #}

{% macro icon(name, cls="icon") -%}
<svg class="{{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"
     aria-hidden="true" focusable="false">
  {%- if name == 'home' -%}
    <path d="M3 10.2 12 3l9 7.2V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>
  {%- elif name == 'check-square' -%}
    <path d="M9 11.5 11.5 14 16 9"/><rect x="3" y="3" width="18" height="18" rx="2.5"/>
  {%- elif name == 'calendar' -%}
    <rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>
  {%- elif name == 'server' -%}
    <rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/>
    <path d="M7 7h.01M7 17h.01"/>
  {%- elif name == 'plug' -%}
    <path d="M9 2v6M15 2v6M6 8h12v3a6 6 0 0 1-6 6 6 6 0 0 1-6-6z"/><path d="M12 17v5"/>
  {%- elif name == 'settings' -%}
    <circle cx="12" cy="12" r="3.2"/>
    <path d="M19.4 15a1.6 1.6 0 0 0 .32 1.77l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.6 1.6 0 0 0-1.77-.32 1.6 1.6 0 0 0-.97 1.47V21a2 2 0 0 1-4 0v-.11a1.6 1.6 0 0 0-1.05-1.47 1.6 1.6 0 0 0-1.77.32l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.6 1.6 0 0 0 4.82 15a1.6 1.6 0 0 0-1.47-.97H3a2 2 0 0 1 0-4h.11a1.6 1.6 0 0 0 1.47-1.05 1.6 1.6 0 0 0-.32-1.77l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.6 1.6 0 0 0 9 4.82a1.6 1.6 0 0 0 .97-1.47V3a2 2 0 0 1 4 0v.11a1.6 1.6 0 0 0 .97 1.47 1.6 1.6 0 0 0 1.77-.32l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.6 1.6 0 0 0-.32 1.77V9a1.6 1.6 0 0 0 1.47.97H21a2 2 0 0 1 0 4h-.11a1.6 1.6 0 0 0-1.49.97z"/>
  {%- elif name == 'book' -%}
    <path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17.5H6.5A2.5 2.5 0 0 0 4 22z"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
  {%- elif name == 'refresh' -%}
    <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
  {%- elif name == 'plus' -%}
    <path d="M12 5v14M5 12h14"/>
  {%- elif name == 'trash' -%}
    <path d="M3 6h18M8 6V4.5A1.5 1.5 0 0 1 9.5 3h5A1.5 1.5 0 0 1 16 4.5V6M19 6l-.9 13.1A2 2 0 0 1 16.1 21H7.9a2 2 0 0 1-2-1.9L5 6"/>
  {%- elif name == 'pencil' -%}
    <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>
  {%- elif name == 'clock' -%}
    <circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.2 1.9"/>
  {%- elif name == 'alert' -%}
    <path d="M10.3 3.9 1.9 18a2 2 0 0 0 1.7 3h16.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>
    <path d="M12 9v4.5M12 17.5h.01"/>
  {%- elif name == 'info' -%}
    <circle cx="12" cy="12" r="9"/><path d="M12 16v-4.5M12 8h.01"/>
  {%- elif name == 'link' -%}
    <path d="M10 13a5 5 0 0 0 7.5.5l3-3A5 5 0 0 0 13.5 3.5l-1.7 1.7"/>
    <path d="M14 11a5 5 0 0 0-7.5-.5l-3 3A5 5 0 0 0 10.5 20.5l1.7-1.7"/>
  {%- elif name == 'logout' -%}
    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>
  {%- elif name == 'lock' -%}
    <rect x="3.5" y="10.5" width="17" height="11" rx="2.5"/><path d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5"/>
  {%- elif name == 'search' -%}
    <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/>
  {%- elif name == 'check' -%}
    <path d="M20 6.5 9.5 17 4 11.5"/>
  {%- endif -%}
</svg>
{%- endmacro %}
