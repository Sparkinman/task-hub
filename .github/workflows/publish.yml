# Builds Task Hub for both Intel and ARM and publishes it to GitHub's registry
# and to Docker Hub.
#
# Nobody has to run a build by hand for this. It happens here, on GitHub's
# machines, which means a Raspberry Pi never has to compile anything and the
# image for every architecture is built from exactly the same commit.
#
# A push to main publishes :main, :edge and :latest, so that the plain
# `docker compose up -d` in the instructions always has something to pull. A
# version tag such as v1.0.0 additionally publishes :1.0.0, :1.0 and :1, which
# is what to pin to if you would rather updates never surprise you.
#
# One repository secret is needed for the Docker Hub half, under
# Settings -> Secrets and variables -> Actions -> New repository secret:
#
#   DOCKERHUB_TOKEN      an access token from hub.docker.com -> Account
#                        Settings -> Personal access tokens, with Read & Write
#                        permission. A token rather than your password, so it
#                        can be revoked on its own without changing anything
#                        else, and so your password is never stored here.
#
# Without those secrets the Docker Hub step is skipped and the GitHub registry
# half still works, so the workflow is useful before you have set them up.
#
# The Docker Hub page itself -- the line under the name and the Overview tab --
# is pushed from .docker/hub-overview.md by the last step, so it is reviewed and
# version-controlled like everything else rather than typed into a website and
# forgotten. The README is not used for it directly: its links and its logo are
# relative to the repository and would be broken on Docker Hub.

name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Not a secret -- it is half of the image name people type. Only the token is
  # secret. Change this and DOCKERHUB_TOKEN together if the project moves.
  DOCKERHUB_USER: sparkinman

jobs:
  # Nothing is published unless every suite passes. The image people pull is
  # therefore never one that failed its own tests -- which matters more here
  # than usual, because the people pulling it have no way to check.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run every suite
        env:
          PYTHONPATH: .
        run: |
          failed=0
          for t in tests/test_*.py; do
            name=$(basename "$t" .py)
            # A directory of its own per suite: they each build a world from
            # scratch and would collide in a shared one.
            if TASKHUB_DATA_DIR="$RUNNER_TEMP/$name" python -m "tests.$name"; then
              echo "PASS  $name"
            else
              echo "FAIL  $name"
              failed=$((failed + 1))
            fi
          done
          echo
          if [ "$failed" -gt 0 ]; then
            echo "$failed suite(s) failed."
            exit 1
          fi
          echo "All suites passed."

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU lets an Intel runner produce the ARM image a Raspberry Pi needs.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Is Docker Hub configured?
        id: hub
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No DOCKERHUB_TOKEN secret; publishing to GitHub only."
          fi

      - name: Sign in to the GitHub registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Allowed to fail. A wrong token or account name should cost you Docker
      # Hub, not the whole publish -- the GitHub registry half has already
      # signed in by this point and can carry on alone.
      - name: Sign in to Docker Hub
        id: hub_login
        if: steps.hub.outputs.enabled == 'true'
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The image names come from the repository and the secret rather than
      # being written down here, so a fork publishes under its own account
      # without editing anything.
      - name: Work out the names and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ steps.hub_login.outcome == 'success' && format('{0}/task-hub', env.DOCKERHUB_USER) || '' }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Caches the layers on GitHub so a later run does not rebuild the
          # Python and Node stages from scratch. An ARM build under emulation
          # is slow; this is the difference between minutes and half an hour.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Docker Hub shows whatever this sets on the repository page. Left unset
      # it shows nothing at all -- no short line under the name and an empty
      # Overview tab -- which is what somebody deciding whether to pull the
      # image sees first. Pushed from a file here rather than typed into the
      # website, so it is version-controlled and cannot drift from the README.
      #
      # Allowed to fail like the login above: a token without permission to
      # edit the repository description should cost the description, not the
      # image that has already been published by this point.
      - name: Update the Docker Hub page
        if: steps.hub_login.outcome == 'success' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_USER }}/task-hub
          short-description: >-
            Self-hosted sync for tasks and calendars across Google, Todoist,
            TickTick, Microsoft, Apple, Obsidian and CalDAV. Your data stays on
            your hardware.
          readme-filepath: .docker/hub-overview.md
