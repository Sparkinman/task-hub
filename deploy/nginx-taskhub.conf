# Task Hub behind nginx.
#
# Copy this into /etc/nginx/sites-available/taskhub, change the two marked
# lines, then:
#
#   sudo ln -s /etc/nginx/sites-available/taskhub /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# For a certificate, the easiest route is certbot, which edits this file for
# you and renews by itself:
#
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d tasks.example.com
#
# Task Hub must be served from the root of a name of its own -- a subdomain like
# tasks.example.com, not example.com/tasks. Its pages link to /settings, /tasks
# and so on from the root, so a sub-path would send every link to the wrong
# place. This is the one thing about it that a reverse proxy cannot paper over.

server {
    listen 80;
    server_name tasks.example.com;          # <-- your name here

    # Uploads and CalDAV bodies are small, but a phone syncing a large calendar
    # is not. The default of 1 MB is low enough to bite.
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8080;   # <-- where Task Hub is listening

        # These four lines are the entire point. Task Hub builds its OAuth
        # redirect URIs and the CalDAV addresses it shows you from the address
        # in this request, so if they are wrong or missing it will hand out an
        # address pointing at nginx's own idea of itself. Host is what it reads
        # first; X-Forwarded-Host is the fallback; X-Forwarded-Proto is how it
        # knows to say https.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # CalDAV clients hold connections open and use methods nginx does not
        # see every day. Without HTTP/1.1 here, phone sync is slow and flaky.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }
}
